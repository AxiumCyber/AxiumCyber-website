name = "axium-cyber-website"
compatibility_date = "2025-04-01"
pages_build_output_dir = "."

[vars]
CF_ACCESS_TEAM_DOMAIN = "replace-with-team.cloudflareaccess.com"
CF_ACCESS_AUD = "replace-with-access-application-audience"
FROM_EMAIL = "Axium Cyber <staff@your-verified-domain.example>"

[[d1_databases]]
binding = "DB"
database_name = "axium-cyber-portal"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"